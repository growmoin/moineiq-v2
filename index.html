.row.on span{color:var(--mu);text-decoration:line-through}

input,select,textarea{font:inherit;width:100%;background:var(--card);color:var(--tx);border:1.5px solid var(--line);border-radius:16px;padding:14px}
textarea{min-height:96px;resize:vertical}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:16px;margin:10px 0}
.hub{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border-radius:20px;padding:16px;background:var(--card);margin-bottom:10px}.hub i{font-style:normal;font-size:26px}.hub span{flex:1}.hub small{display:block;color:var(--mu)}
.big{font-size:48px;font-weight:800;color:var(--ac);text-align:center}
.tag{display:inline-block;font-size:12px;padding:2px 10px;border-radius:99px;border:1px solid var(--line);color:var(--mu);margin-right:6px}
#tm{font:800 54px Poppins,sans-serif}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:#080a0ff2;backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:8px 0 calc(8px + env(safe-area-inset-bottom,0));z-index:10}

#toast{max-width:90vw;text-align:center}.brandimg{height:40px;width:auto;display:block}.brand{font-size:20px}
@media(prefers-reduced-motion:reduce){#splash img{animation:none}}
</style>

<script>

const SH=[['Focus session-এ ফোন দূরে রেখেছি','অকারণ scrolling-এর বদলে একটি কাজ'],['Perfect হওয়ার অপেক্ষা না করে শুরু করেছি','কমপক্ষে ১০ মিনিট চেষ্টা'],['সিদ্ধান্তের আগে একটু থেমে plan দেখেছি','কারো অনুরোধে সঙ্গে সঙ্গে হ্যাঁ বলার আগে'],['Focus নষ্ট হয় এমন জায়গা এড়িয়ে চলেছি','লক্ষ্যকে অগ্রাধিকার দিয়েছি'],['Project save করে কাজের প্রমাণ রেখেছি','ছোট progress-ও progress']];

function streak(){let n=0,i=cnt(dk())?0:1;while(cnt(ago(i))){n++;i++}return n}
const fmt=s=>pad(Math.floor(s/60))+':'+pad(s%60);

const chips=(L,cur,a)=>`<div class="chips">${L.map(t=>`<button class="pill ${t==cur?'on':''}" data-a="${a}" data-v="${t}">${t}</button>`).join('')}</div>`;
const words=()=>{const n=Math.floor(Date.now()/864e5);return[0,1,2,3,4].map(i=>W[(n*5+i)%W.length])};

const wk7=()=>[6,5,4,3,2,1,0].map(i=>{const d=ago(i),x=Object.entries(S.aw).filter(k=>k[0].startsWith(d+'|')).reduce((t,k)=>t+k[1],0);return{d,x,n:cnt(d),f:S.fm[d]||0,l:['রবি','সোম','মঙ্গল','বুধ','বৃহঃ','শুক্র','শনি'][new Date(d+'T00:00:00').getDay()]}});

return`<h2>এই সপ্তাহ</h2><div class="card">${chart(a)}<div class="hd mu" style="margin:6px 0 0"><b style="font-weight:500">XP ${sx}</b><span>Focus ${fm} মিনিট</span></div></div><h2>Skill progress</h2><div class="card">${skills()}</div>
<h2>Current project</h2><div class="card"><b>Modern Luxury Home Tour</b><div class="line"><i style="width:${pd/STEPS.length*100}%"></i></div><div class="hd mu" style="margin:0"><b style="font-weight:500">${pd}/${STEPS.length} ধাপ</b><button data-a="go" data-v="proj" style="padding:6px 14px">খুলুন</button></div></div>
<div class="card hd"><span style="font-size:26px">🤖</span><div style="flex:1"><b>AI Mentor</b><div class="mu" style="margin:0">এখনও সংযুক্ত নয়</div></div><button data-a="go" data-v="ai" style="padding:6px 14px">দেখুন</button></div>

home(){const t=dk(),M=S.missions,dn=M.filter(m=>S.aw[t+'|'+m.id]),nx=M.find(m=>!S.aw[t+'|'+m.id]),x=xp(),p=dn.length/M.length,tx=dn.reduce((a,m)=>a+S.aw[t+'|'+m.id],0),h=new Date().getHours(),R=122,c=2*Math.PI*R;

spk:()=>{const L=STAGES[S.stage];say(L[S.ln%L.length][0]);return false},sp:v=>{say(v);return false},nl:()=>{S.ln++},
cal1:()=>{gcal('MOINEIQ: আজকের মিশন',S.missions.map(m=>'• '+m.t+' (+'+m.xp+' XP)').join('\n'),($('#al')||{}).value||S.al,45,1);return false},
cal2:()=>{gcal('💧 পানি খান','এক গ্লাস পানি খান, তারপর MOINEIQ-এ লগ করুন।',($('#wal')||{}).value||S.wal,10,1);return false},
cm:v=>{const m=S.missions.find(x=>x.id===v);if(m)gcal('MOINEIQ: '+m.t,m.d,S.al,30,0);return false},
nf:()=>{if(S.nf){S.nf=0;return}if(typeof Notification==='undefined'){toast('এই ব্রাউজারে নোটিফিকেশন নেই');return false}Notification.requestPermission().then(p=>{S.nf=p==='granted'?1:0;save();render();toast(S.nf?'চালু হয়েছে (অ্যাপ খোলা থাকলে)':'অনুমতি দেওয়া হয়নি')});return false},
bk:()=>{if(navigator.clipboard)navigator.clipboard.writeText(JSON.stringify(S)).then(()=>toast('Backup কপি হয়েছে'),()=>toast('কপি হয়নি। আরও > Backup ব্যবহার করুন'));else toast('কপি সম্ভব নয়');return false},
rb:()=>{U.tab='more';U.sub='bak';scrollTo(0,0)},
fmin:v=>{if(!FS.run){FS.min=+v;FS.left=FS.min*60}},
fgo:()=>{if(FS.run){FS.left=Math.max(0,Math.round((FS.end-Date.now())/1000));FS.run=false;clearInterval(FS.id)}else{if(FS.left<=0)FS.left=FS.min*60;FS.end=Date.now()+FS.left*1000;FS.run=true;FS.id=setInterval(tick,250)}},
frst:()=>{clearInterval(FS.id);FS.run=false;FS.left=FS.min*60},
shk:v=>{const t=dk(),a=S.sh[t]||(S.sh[t]=[]),i=a.indexOf(+v);i>-1?a.splice(i,1):a.push(+v)},
shsave:()=>{toast('Reflection সংরক্ষিত ✓');return false},
shrst:()=>{if(confirm('আজকের shield ও reflection মুছে যাবে। নিশ্চিত?')){delete S.sh[dk()];delete S.refl[dk()]}},
trk:v=>S.track=v,rs:v=>S.road[v]=!S.road[v]||undefined,ps:v=>S.proj[v]=!S.proj[v]||undefined,
plog:()=>{const x=$('#lx').value.trim();if(!x){toast('কিছু লিখুন');return false}S.log.push({id:Date.now(),t:$('#lt').value,x:x,m:Math.max(0,+$('#lm').value||0),d:dk()})},
dlog:v=>S.log=S.log.filter(l=>l.id!=v),
lrn:()=>{const t=dk();S.eng[t]=!S.eng[t]||undefined},
w:v=>{const d=dk();S.water[d]=Math.max(0,(S.water[d]||0)+ +v)},goal:v=>S.goal=Math.min(30,Math.max(1,S.goal+ +v)),
exp:()=>{const j=JSON.stringify(S,null,2);$('#js').value=j;try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([j],{type:'application/json'}));a.download='moineiq-backup-'+dk()+'.json';a.click()}catch(e){}toast('Export হয়েছে');return false},
imp:()=>{try{const r=JSON.parse($('#js').value);const ok=r&&r.v===2&&Array.isArray(r.missions)&&r.missions.length>=3&&r.missions.every(m=>m&&typeof m.id==='string'&&typeof m.t==='string'&&typeof m.xp==='number')&&r.aw&&Object.values(r.aw).every(n=>typeof n==='number')&&Array.isArray(r.log);if(!ok)throw 0;S=Object.assign(structuredClone(DEF),r);toast('Restore সফল হয়েছে ✓')}catch(e){toast('ভুল ফাইল। আগের ডেটা অক্ষত আছে।');return false}},
rst:()=>{if(confirm('সব ডেটা মুছে যাবে। নিশ্চিত?'))S=structuredClone(DEF);else return false}};
function tick(){FS.left=Math.max(0,Math.round((FS.end-Date.now())/1000));if(FS.left<=0){clearInterval(FS.id);FS.run=false;S.fm[dk()]=(S.fm[dk()]||0)+FS.min;FS.left=FS.min*60;save();toast('Focus session শেষ 🎉');render();return}const e=$('#tm'),a=$('#fa');if(e)e.textContent=fmt(FS.left);if(a)a.style.strokeDashoffset=C*(1-FS.left/(FS.min*60))}
function say(t){if(!('speechSynthesis' in window)){toast('এই ব্রাউজারে শোনার সুবিধা নেই');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.85;speechSynthesis.speak(u)}
function gcal(title,det,hm,dur,rec){const q=hm.split(':').map(Number),s=new Date(),f=d=>d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'T'+pad(d.getHours())+pad(d.getMinutes())+'00';s.setHours(q[0],q[1],0,0);if(s<new Date())s.setDate(s.getDate()+1);const e=new Date(s.getTime()+dur*6e4);window.open('https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(title)+'&details='+encodeURIComponent(det)+'&dates='+f(s)+'/'+f(e)+'&ctz='+encodeURIComponent(Intl.DateTimeFormat().resolvedOptions().timeZone)+(rec?'&recur=RRULE:FREQ=DAILY':''),'_blank')}
const NL={};
function notify(){if(!S.nf||typeof Notification==='undefined'||Notification.permission!=='granted')return;const n=new Date(),hm=pad(n.getHours())+':'+pad(n.getMinutes()),p=S.missions.filter(m=>!S.aw[dk()+'|'+m.id]).length;[[S.al,'MOINEIQ',p?`আজ ${p}টি মিশন বাকি। ছোট একটি ধাপ নিন।`:''],[S.wal,'💧 পানি',`আজ ${S.water[dk()]||0}/${S.goal} গ্লাস। এক গ্লাস খান।`]].forEach(x=>{const k=dk()+x[0]+x[1];if(x[2]&&x[0]===hm&&!NL[k]){NL[k]=1;try{new Notification(x[1],{body:x[2]})}catch(e){}}})}
const NAV=[['home','🎯','আজ'],['focus','⏰','Focus'],['shield','🛡️','Shield'],['plan','🗓️','Plan'],['more','✨','আরও']];
function render(){$('#app').innerHTML=V[U.tab]();$('#nav').innerHTML=NAV.map(n=>`<button class="${U.tab==n[0]?'on':''}" data-a="tab" data-v="${n[0]}"><i>${n[1]}</i>${n[2]}</button>`).join('')}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;if(A[b.dataset.a](b.dataset.v)!==false){save();render()}});
document.addEventListener('input',e=>{if(e.target.id==='rf'){S.refl[dk()]=e.target.value.slice(0,1000);save()}});
document.addEventListener('change',e=>{if(e.target.id==='al'||e.target.id==='wal'){S[e.target.id]=e.target.value||S[e.target.id];save()}if(e.target.id==='fl'&&e.target.files[0]){const r=new FileReader();r.onload=()=>{$('#js').value=String(r.result).slice(0,2e6)};r.readAsText(e.target.files[0])}});
(function(){let seen;try{seen=sessionStorage.getItem('sp');sessionStorage.setItem('sp','1')}catch(e){}const sp=$('#splash');if(seen){sp.remove();return}sp.innerHTML=`<img src="${LOGO}" alt="MOINEIQ: Build Better Days">`;setTimeout(()=>{sp.style.opacity=0;setTimeout(()=>sp.remove(),700)},1500)})();
render();setInterval(notify,20000);
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
